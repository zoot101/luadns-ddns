######################################
# Luadns-DDNS Config
######################################
# Github Page: https://github.com/zoot101/luadns-ddns 
######################################

#####################################
# Public IP Source
#####################################
# How does the script obtain the Public IP? This can be
# set to three methods:
# 1. Local Interface: If the script is ran on a system
#    with a Public IP directly on one of its interfaces for
#    example, a firewall, the script can obtain the IP
#    directly from the interface itself.
# 2. HTTP Server: Sends a HTTP or HTTPS request to an
#    internet based server that returns the IP in Plain TXT.
#    Useful if the system that runs the script is behind
#    NAT.
# 3. DNS Query: There are certain DNS Servers that host
#    DNS records that can be queried directly to obtain ones
#    Public IP address. This is often much faster than the
#    HTTP/HTTPS option, but requires querying the Nameserver
#    for the Record Directly.
# Set to either of these 3 options:
#public_ip_source="Local Interface"
#public_ip_source="HTTP Server"
#public_ip_source="DNS Query"

# Depending on what One sets above, further information is 
# required below.
# * If using the Local Interface method, specify the name of
#   the interface here.
# * If using the HTTP Server Method, comment out the array
#   of HTTP Servers specified here.
# * If using the DNS Query Method, comment out the list of
#   commands below. The commands are used as different
#   Nameserver use different methods for determining the
#   Public IP. Some return TXT records, for others its standard
#   A Records. One should use single quotes ' ' to wrap commands
#   in to ensure all characters are correctly passed in
# In the case of the HTTP Server or DNS Query method the Servers
# or commands are stepped through one by one until a successful
# result is obtained.
#public_ip_interface="enp1s0"
#public_ip_http_servers=(
#  "https://ifconfig.me"
#  "https://ifconfig.co"
#  "https://icanhazip.com"
#  "https://ipecho.net/plain"
#)
#public_ip_dns_commands=(
#  "dig @resolver1.opendns.com myip.opendns.com A -4 +short"
#  "dig @ns1.google.com o-o.myaddr.l.google.com TXT -4 +short | tr -d \""
#  "dig @1.1.1.1 whoami.cloudflare TXT CH -4 +short | tr -d \""
#  "dig @ns1-1.akamaitech.net whoami.akamai.net A -4 +short"
#)

#####################################
# Times To Update Regardless of IP Change
#####################################
# Its useful to have the script update the desired records regardless
# at certain times throughout the day. This helps ensure the records
# are always updated and reachable.
#
# Recommend to leave unchanged as it should match what is in
# /etc/systemd/system/luadns-ddns.timer
# If these are changed, then the timer file needs to be changed
# also.
times_to_update=(
  "00:00"
  "02:00"
  "04:00"
  "06:00"
  "08:00"
  "10:00"
  "12:00"
  "14:00"
  "16:00"
  "18:00"
  "20:00"
  "22:00"
)

#####################################
# Luadns Credentials
#####################################
# Login email for your Luadns.com Account
luadns_email="mail@example.org"

# API Key
# Permission to access a single zone is the default that Luadns provide
# Can be generated easily with the Luadns.com Web UI. Not really ideal to
# have to store it here, but things won't work without it
luadns_api_key="123456789ABCDEF0"

####################################
# DNS Record Details
####################################
# Specify the Zone Name. If for example the record is DDNS1.zone1.org,
# the Zone Name is "zone1.org" in this example. This allows the script
# to be more simple as it does not have to query the Public Suffix List
# to determine the correct zone name. Note that while the script can
# update several DNS A Records at once, they all must be part of the
# same DNS Zone. Ex: ddns1.zone1.org, ddns2.zone1.org etc.
dns_zone_name="example.org"

# Specify the DNS Records that will be updated at Luadns.com. Keep brackets
# to define as an array. Add as many as desired, the script does not
# impose a limit.
#
# To defined multiple use the following:
# record_names=( "record1.example.org" "record2.example.org" ... )
#
# For a Single Record, use the following:
# record_names="record1.example.org"
dns_record_names=(
  "record1.example.org"
  # Add as many as desired...
)

####################################
# Use Non-Default Network Interface?
####################################
# Use a non-default local network interface for talking to the Luadns API
# and for querying the records to verify an update has been successful.
#
# This option should not be needed for most default setups. This option can
# be useful in the event one is running the script on a system behind a firewall
# with multiple local network interfaces whereby a different Public IP is reachable
# depending on which interface is used.
#
# An example could be a Dual WAN Setup, a Firewall that uses Policy
# Based Routing for different WAN connections, or if one is using a VPN
# and wishes the record to reflect the Public IP of the VPN instead.
#
# This could also be useful if one is using a VPN as certain VPN providers do
# thing like Hijack ones DNS requests leading to undesirable results when
# querying the Luadns nameservers directly.
#
# Must be a valid IPv4 address of a Local Interface. Comment out if not using
#outgoing_interface_ip=192.168.1.4

####################################
# Email Notifications
####################################
# Email address to send notifications to. To disable email notifications
# leave either of these commented out.
#email_address="mail1@example2.org"
#muttrc_path="/path/to/muttrc/path/here"

###################################################
# Notification Hook (Optional)
###################################################
# Path to a custom notification hook if one wishes to use an alternative
# form of notification than standard emails. If one uses this option,
# a more compact body of TXT is used than the standard emails.
#
# If any variables are required define them here with export
# example: export ntfy_url="https://ntfy.sh/channel_name" etc.
#
# The hook is called like so, the txt file containing the notification
# body is generated by the script and automatically deleted after the
# script finishes.
# /path/to/hook "Email-Subject" "Email-Body" or
# /path/to/hook "DDNS Update OK: ddns1.example.org" "/path/to/body.txt"
#notification_hook="/path/to/notification/hook"

